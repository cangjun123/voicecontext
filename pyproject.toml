[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecontext"
version = "0.1.1"
description = "Windows voice and clipboard context composer for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "httpx>=0.27",
  "sounddevice>=0.4.7",
  "keyboard>=0.13.5; platform_system == 'Windows'",
  "mouse>=0.7.1; platform_system == 'Windows'",
  "keyring>=24",
  "dashscope>=1.26.3",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
funasr = [
  "funasr-onnx>=0.4.1",
  "jieba>=0.42.1",
  "torch>=2.3",
]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "pyinstaller>=6"]

[project.gui-scripts]
voicecontext = "voice_context.app:main"

[tool.setuptools.packages.find]
include = ["voice_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
